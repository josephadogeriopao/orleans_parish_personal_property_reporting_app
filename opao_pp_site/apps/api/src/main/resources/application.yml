spring:
  # 💡 FORCE SPRING BOOT TO READ LOCAL ENVIRONMENT PARAMETERS (.env)
  config:
    import: "optional:file:.env"

  application:
    name: pp_api

  docker:
    compose:
      enabled: false
  
  # MySQL Database Configuration
  datasource:
    url: jdbc:mysql://localhost:3306/opoppr?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA / Hibernate Configurations
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate

  # Liquibase Migration Configuration
  liquibase:
    enabled: true
    change-log: "classpath:db/changelog/master.yaml"
    drop-first: false

  # 📧 Unified Mail Infrastructure
  mail:
    host: "${SMTP_HOST:localhost}"
    port: ${SMTP_PORT:587}       # 🟢 Kept numeric fix (no quotes)
    username: "${SMTP_USERNAME:}"
    password: "${SMTP_PASSWORD:}"
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            #TODO this should be configured properly for production environments
            # In production, replace "*" with the specific trusted certificate authorities or hosts
            trust: "*"  # Trust all SSL certificates 
application:
  security:
    argon2:
      salt-length: 16       
      hash-length: 32       
      parallelism: 1        
      memory: 65536         
      iterations: 3         
  frontend-url: "${FRONTEND_URL:http://localhost:3000}"
  email:
    from-address: "${EMAIL_FROM_ADDRESS:josephadogeridev@gmail.com}"
    from-name: "Orleans Parish Assessor's Office"

server:
  port: 9000
